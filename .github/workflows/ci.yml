name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run deterministic tests
        run: pytest

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install package and type dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run Pyright
        run: pyright src/dependabot_watcher tests

  package:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install packaging tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  platform-smoke:
    name: Installed artifact (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Install wheel and test runner
        run: >-
          python -c "import glob, subprocess, sys;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', glob.glob('dist/*.whl')[0], 'pytest>=8.0'])"
      - name: Smoke installed CLI
        run: |
          dependabot-watcher --version
          dependabot-watcher --help
      - name: Check native Windows private-state prerequisites
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess
          import tempfile
          from pathlib import Path
          from dependabot_watcher import runtime_state
          real_run = subprocess.run
          def observed_run(*args, **kwargs):
              result = real_run(*args, **kwargs)
              print(f"Native ACL helper exit: {result.returncode}", flush=True)
              if result.returncode:
                  print(result.stderr, flush=True)
              return result
          runtime_state.subprocess.run = observed_run
          with tempfile.TemporaryDirectory(prefix='watcher-native-ci-') as directory:
              runtime_state.ensure_private_directory(Path(directory) / 'state')
      - name: Test native Windows installed contracts
        if: runner.os == 'Windows'
        run: >-
          pytest -v -ra --maxfail=1
          tests/test_runtime_state.py::test_native_windows_private_json_round_trip_and_atomic_replace
          tests/test_runtime_state.py::test_native_windows_run_lock_rejects_a_second_process
          tests/test_git_environment.py
          tests/test_policy.py
      - name: Run deterministic tests against installed macOS artifact
        if: runner.os == 'macOS'
        run: pytest -v -ra --maxfail=5
