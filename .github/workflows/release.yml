name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation and packaging tools
        run: python -m pip install -e '.[dev]' build twine
      - name: Validate release commit
        run: |
          pytest
          pyright src/dependabot_watcher tests
      - name: Build distributions once
        run: python -m build
      - name: Check metadata and tag version
        run: |
          python -m twine check --strict dist/*
          python -m venv release-wheel-smoke
          python -m venv release-sdist-smoke
          release-wheel-smoke/bin/python -m pip install dist/*.whl
          release-sdist-smoke/bin/python -m pip install dist/*.tar.gz
          expected="$(python -c "import runpy; from packaging.version import Version; v=runpy.run_path('src/dependabot_watcher/__init__.py')['__version__']; assert str(Version(v)) == v, 'Source version must use canonical packaging syntax'; print(v)")"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "v$expected"
          fi
          wheel_actual="$(release-wheel-smoke/bin/dependabot-watcher --version | awk '{print $2}')"
          sdist_actual="$(release-sdist-smoke/bin/dependabot-watcher --version | awk '{print $2}')"
          test "$wheel_actual" = "$expected"
          test "$sdist_actual" = "$expected"
          test "$(release-wheel-smoke/bin/python -c "from importlib.metadata import version; print(version('dependabot-watcher'))")" = "$expected"
          test "$(release-sdist-smoke/bin/python -c "from importlib.metadata import version; print(version('dependabot-watcher'))")" = "$expected"
          release-wheel-smoke/bin/dependabot-watcher --help >/dev/null
          release-sdist-smoke/bin/dependabot-watcher --help >/dev/null
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  build-windows:
    name: Build Windows review package
    runs-on: windows-2025
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        id: dotnet
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: ga
      - name: Select the installed SDK
        env:
          SELECTED_DOTNET_SDK: ${{ steps.dotnet.outputs.dotnet-version }}
        run: dotnet new globaljson --sdk-version "$env:SELECTED_DOTNET_SDK" --roll-forward disable
      - name: Publish self-contained Windows component
        run: >-
          dotnet publish native/windows/src/WatcherNativeProof.csproj
          --configuration Release --runtime win-x64 --self-contained true
          --output "$env:RUNNER_TEMP/watcher-native-publish"
          -p:ContinuousIntegrationBuild=true
      - name: Check the built native contracts
        run: >-
          dotnet run --project native/windows/tests/NotificationContracts.csproj
          --configuration Release --
          "$env:RUNNER_TEMP/watcher-native-publish/WatcherNativeProof.dll"
      - name: Package the validated component
        run: |
          $version = python -c "import runpy; print(runpy.run_path('src/dependabot_watcher/__init__.py')['__version__'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and package version differ.' }
          python native/windows/package.py --published-directory "$env:RUNNER_TEMP/watcher-native-publish" --assets-file native/windows/src/obj/project.assets.json --output-directory release-native --version "$version" --source-commit "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Get-Item "release-native/dependabot-watcher-review-$version-windows-x64.zip"
          $digest = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText("$pwd/release-native/SHA256SUMS", "$digest  $($archive.Name)`n", [System.Text.Encoding]::ASCII)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release-native/*"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-review
          path: release-native/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: [build, build-windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/dependabot-watcher/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the release tag still names the built commit
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish-github:
    name: Publish GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - name: Verify the release tag still names the built commit
        run: |
          git fetch --no-tags --depth=1 origin "refs/tags/$GITHUB_REF_NAME"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-review
          path: release-native
      - name: Verify Windows archive checksum
        working-directory: release-native
        run: sha256sum --check SHA256SUMS
      - name: Create release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/* release-native/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Dependabot Watcher $GITHUB_REF_NAME"
