schema_version = 1

[operation]
# Approval-gated execution requires autonomy = "approval_required" together with
# mutation_enabled = true, plus explicit workflow policy below. The safe default
# remains read-only.
autonomy = "read_only"
mutation_enabled = false
# When true, execution additionally requires current successful advice under
# this profile's exact advisory mode, models, reasoning, timeout, and budget.
require_advice_before_execution = false
report_verbosity = "concise"
machine_output = "json"

[collection]
history_lookback_days = 30
max_open_prs = 100
max_open_alerts = 500
max_history_items = 200
max_files_per_pull_request = 500
max_manifest_files = 50
max_manifest_file_bytes = 131072
max_manifest_depth = 5
command_timeout_seconds = 120

[path_policy]
additional_dependency_patterns = []
additional_sensitive_patterns = []

[advisory]
mode = "off"

[[repositories]]
name = "example-org/example-app"
default_branch = "main"

[repositories.path_policy]
additional_dependency_patterns = ["deps/*.lock"]
additional_sensitive_patterns = ["ops/production/**"]

[repositories.workflow]
merge_method = "repository_default"
# promotion_branch = "main"
required_checks = []
deployment_environments = []
validation_notes = []
